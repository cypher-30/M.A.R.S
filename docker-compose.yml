# Local PostgreSQL only. The API and dashboard run directly on your machine so
# you keep fast reloads while building.
services:
  db:
    image: postgres:16-alpine
    container_name: mars-db
    environment:
      POSTGRES_USER: mars
      POSTGRES_PASSWORD: mars
      POSTGRES_DB: mars
    ports:
      - "5432:5432"
    volumes:
      - mars-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mars"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mars-pgdata:
